name: PennyPal CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'phase2/**'

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release web app
        run: flutter build web --release

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/rules/package-lock.json
      - name: Install rules test dependencies
        working-directory: test/rules
        run: npm ci
      - name: Run Firestore emulator tests
        working-directory: test/rules
        run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project pennypal-rules-test "npm test"

  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Function dependencies
        working-directory: functions
        run: npm ci
      - name: Run Function tests
        working-directory: functions
        run: npm test
